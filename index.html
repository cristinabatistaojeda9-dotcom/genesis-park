<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#06110b">

<title>Genesis Park Control</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #06110b;
    color: #d9f5df;
    font-family: Arial, sans-serif;
}

header {
    background: #091b11;
    border-bottom: 1px solid #315c3c;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
}

.online {
    color: #70e58b;
    font-size: 12px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

.dashboard {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 15px;
}

/* MAPA */

.map-container {
    position: relative;
    background: #0c2415;
    border: 1px solid #315c3c;
    overflow: hidden;
}

.map-title {
    padding: 10px;
    background: #0a1b10;
    border-bottom: 1px solid #315c3c;
    font-size: 12px;
    letter-spacing: 2px;
}

#parkMap {
    width: 100%;
    display: block;
    background: #173722;
}

/* ZONAS */

.zone {
    fill: #214d2b;
    stroke: #7aa37e;
    stroke-width: 2;
}

.zone-danger {
    fill: #50301e;
}

.zone-water {
    fill: #183f52;
    stroke: #4f91aa;
}

.road {
    fill: none;
    stroke: #9c936f;
    stroke-width: 12;
    opacity: .8;
}

.road-small {
    fill: none;
    stroke: #777052;
    stroke-width: 6;
}

/* EDIFICIOS */

.building {
    fill: #3d4940;
    stroke: #b2c4b4;
    stroke-width: 2;
}

.building-text {
    fill: white;
    font-size: 12px;
    text-anchor: middle;
}

/* DINOSAURIOS */

.dino {
    cursor: pointer;
}

.dino circle {
    stroke: white;
    stroke-width: 2;
}

.dino text {
    fill: white;
    font-size: 12px;
    text-anchor: middle;
    pointer-events: none;
}

.dino:hover circle {
    stroke-width: 4;
}

/* JUGADOR */

.player {
    cursor: pointer;
}

.player circle {
    fill: #4aa3ff;
    stroke: white;
    stroke-width: 3;
}

.player text {
    fill: white;
    font-size: 11px;
    text-anchor: middle;
}

/* PANEL */

.panel {
    background: #0b1c12;
    border: 1px solid #315c3c;
    padding: 15px;
}

.panel h2 {
    margin-top: 0;
    font-size: 17px;
}

.stat {
    border-bottom: 1px solid #263d2c;
    padding: 9px 0;
}

.stat-name {
    color: #7d9d84;
    font-size: 11px;
}

.stat-value {
    margin-top: 3px;
}

.danger {
    color: #ff6b5f;
}

.safe {
    color: #70e58b;
}

.warning {
    color: #e8bd58;
}

button,
select {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: #122c1a;
    color: white;
    border: 1px solid #416d4b;
    font-size: 14px;
}

button {
    cursor: pointer;
}

button:hover {
    background: #1b4327;
}

.alert {
    border-left: 4px solid #e85b50;
    background: #24130f;
    padding: 10px;
    margin-top: 10px;
    font-size: 13px;
}

.legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 15px;
    font-size: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.bottom-menu {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
}

.bottom-menu button {
    margin: 0;
    font-size: 11px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #54705a;
    font-size: 11px;
}

@media (max-width: 800px) {

    .dashboard {
        grid-template-columns: 1fr;
    }

    .bottom-menu {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
GENESIS PARK
</div>

<div class="online">
● SYSTEM ONLINE
</div>

</header>


<main>

<div class="dashboard">

<!-- MAPA -->

C570 430 610 350 880 290"/>

class="building-text"
x="450"

</text>

<text
class="building-text"
x="450"

CENTER
</text>


<!-- LABORATORIO -->

<rect
class="building"
x="55"

width="110"
height="65"
rx="5"/>

<text
class="building-text"
x="110"

</text>


<!-- ENFERMERÍA -->

<rect
class="building"
x="250"
y="475"
width="100"
height="55"
rx="5"/>

<text
class="building-text"
x="300"
y="508">
MEDICAL
</text>


<!-- PUERTA NORTE -->

<rect
class="building"
x="405"

width="90"
height="35"/>

class="building-text"
x="450"

GATE N

<g class="dino"
data-dino="trike01">

<circle
cx="200"
cy="450"
r="14"
fill="#71a86b"/>

<text
x="200"
y="454">
H
</text>

</g>


<!-- DINOSAURIO 4 -->

<g class="dino"
data-dino="stego01">

<circle
cx="290"
cy="350"
r="14"
fill="#71a86b"/>

<text
x="290"
y="354">
H
</text>

<!-- JUGADOR -->

<g
class="player"
id="playerMarker">

<circle
cx="450"
cy="390"
r="10"/>

x="450"

</text>

</svg>

</section>


<!-- PANEL INFORMACIÓN -->

<aside class="panel">

<h2 id="panelTitle">
PARK CONTROL
</h2>

<div id="panelContent">

<div class="stat">

<div class="stat-name">
SYSTEM
</div>

<div class="stat-value safe">
ONLINE
</div>

</div>

<div class="stat">

<div class="stat-name">
TRACKED ANIMALS
</div>

<div class="stat-value">
4
</div>

</div>

<div class="stat">

<div class="stat-name">
ACTIVE ALERTS
</div>

<div class="stat-value danger">
1
</div>

</div>

</div>


<select id="filter">

<option value="all">
Todos los dinosaurios
</option>

<option value="danger">
Especies peligrosas
</option>

<option value="herbivore">
Herbívoros
</option>

</select>


<button id="locateButton">
📍 LOCALIZARME
</button>


<div class="legend">

<div class="legend-item">

<span
class="legend-dot"
style="background:#c4473f">
</span>

T-Rex

</div>

<div class="legend-item">

<span
class="legend-dot"
style="background:#d86a43">
</span>

Raptor

</div>

<div class="legend-item">

<span
class="legend-dot"
style="background:#71a86b">
</span>

Herbívoro

</div>

<div class="legend-item">

<span
class="legend-dot"
style="background:#4aa3ff">
</span>

Jugador

</div>

</div>


<div class="alert">

<strong>⚠ ALERTA</strong>

<br><br>

Actividad detectada en
Raptor Complex.

</div>

</aside>

</div>


<!-- MENÚ -->

<div class="bottom-menu">

<button>
🗺 MAPA
</button>

<button>
🦖 DINOSAURIOS
</button>

<button>
🚨 ALERTAS
</button>

<button>
📚 DATABASE
</button>

</div>

</main>


<footer>

GENESIS PARK
<br>
DINOSAUR MONITORING SYSTEM

</footer>


<script>

/* =========================
   BASE DE DATOS DINOSAURIOS
========================= */

const dinosaurs = {

rex01: {

name: "REX-01",

species: "Tyrannosaurus rex",

sex: "Macho",

age: "14 años",

length: "11,8 m",

weight: "7.200 kg",

status: "ACTIVO",

danger: "EXTREMO"

},

raptor01: {

name: "RAPTOR-01",

species: "Velociraptor",

sex: "Hembra",

age: "8 años",

length: "1,9 m",

weight: "42 kg",

status: "ACTIVO",

danger: "ALTO"

},

trike01: {

name: "TRIKE-01",

species: "Triceratops",

sex: "Macho",

age: "21 años",

length: "8 m",

weight: "6.000 kg",

status: "ACTIVO",

danger: "MEDIO"

},

stego01: {

name: "STEGO-01",

species: "Stegosaurus",

sex: "Hembra",

age: "17 años",

length: "7 m",

weight: "3.100 kg",

status: "ACTIVO",

danger: "BAJO"

}

};


/* =========================
   MOSTRAR DINOSAURIO
========================= */

const dinosaurMarkers =
document.querySelectorAll(".dino");

const panelTitle =
document.getElementById("panelTitle");

const panelContent =
document.getElementById("panelContent");


dinosaurMarkers.forEach(marker => {

marker.addEventListener("click", () => {

const id =
marker.dataset.dino;

const dino =
dinosaurs[id];

panelTitle.innerText =
dino.name;

panelContent.innerHTML = `

<div class="stat">

<div class="stat-name">
ESPECIE
</div>

<div class="stat-value">
${dino.species}
</div>

</div>

<div class="stat">

<div class="stat-name">
SEXO
</div>

<div class="stat-value">
${dino.sex}
</div>

</div>

<div class="stat">

<div class="stat-name">
EDAD
</div>

<div class="stat-value">
${dino.age}
</div>

</div>

<div class="stat">

<div class="stat-name">
LONGITUD
</div>

<div class="stat-value">
${dino.length}
</div>

</div>

<div class="stat">

<div class="stat-name">
PESO
</div>

<div class="stat-value">
${dino.weight}
</div>

</div>

<div class="stat">

<div class="stat-name">
ESTADO
</div>

<div class="stat-value safe">
${dino.status}
</div>

</div>

<div class="stat">

<div class="stat-name">
NIVEL DE RIESGO
</div>

<div class="stat-value danger">
${dino.danger}
</div>

</div>

`;

});

});


/* =========================
   GPS
========================= */

const locateButton =
document.getElementById("locateButton");

locateButton.addEventListener("click", () => {

if (!navigator.geolocation) {

alert(
"La geolocalización no está disponible."
);

return;

}

locateButton.innerText =
"📡 LOCALIZANDO...";

navigator.geolocation.getCurrentPosition(

position => {

locateButton.innerText =
"📍 POSICIÓN ACTUALIZADA";

alert(
"Posición obtenida:\n\n" +
"Latitud: " +
position.coords.latitude +
"\nLongitud: " +
position.coords.longitude
);

},

error => {

locateButton.innerText =
"📍 LOCALIZARME";

alert(
"No se pudo obtener tu posición."
);

}

);

});


/* =========================
   FILTROS
========================= */

const filter =
document.getElementById("filter");


filter.addEventListener("change", () => {

const value =
filter.value;

dinosaurMarkers.forEach(marker => {

const dino =
dinosaurs[marker.dataset.dino];

let visible = true;

if (value === "danger") {

visible =
dino.danger === "ALTO" ||
dino.danger === "EXTREMO";

}

if (value === "herbivore") {

visible =
dino.species === "Triceratops" ||
dino.species === "Stegosaurus";

}

marker.style.display =
visible ? "" : "none";

});

});

</script>

</body>

</html>
